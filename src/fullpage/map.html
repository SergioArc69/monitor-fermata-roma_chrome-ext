<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Mappa — Monitor Fermata ATAC Roma</title>
    <link rel="stylesheet" href="map.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #instructionBar {
        height: 37px;
        box-sizing: border-box;
        padding: 8px 14px;
        background: #f4f4f4;
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #instruction {
        flex: 1;
      }
      #stopMonitoringButton {
        display: none;
        flex: none;
        padding: 4px 9px;
        border: 1px solid #b3261e;
        border-radius: 4px;
        color: #b3261e;
        background: white;
        cursor: pointer;
      }
      #stopMonitoringButton:hover {
        background: #fce8e6;
      }
      #lineFilterBar {
        height: 33px;
        box-sizing: border-box;
        padding: 6px 14px;
        background: #f9f9f9;
        border-bottom: 1px solid #ddd;
        display: none;
        align-items: center;
        gap: 10px;
        overflow-x: auto;
        white-space: nowrap;
      }
      #lineFilterBar label {
        white-space: nowrap;
      }
      #lineFilterToggle {
        flex: none;
        font-weight: 600;
      }
      #lineFilterList {
        display: flex;
        gap: 8px;
      }
      #map {
        position: absolute;
        top: 37px;
        bottom: 0;
        left: 0;
        right: 0;
      }
      #map.with-line-filter {
        top: 70px;
      }
      #map.with-bus-bar {
        bottom: 56px;
      }
      #busStatusBar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        padding: 0 10px;
        align-items: center;
        background: #f9f9f9;
        border-top: 1px solid #ddd;
        display: none;
      }
      .bus-chip {
        display: inline-block;
        background: #ededed;
        border-radius: 4px;
        padding: 4px 8px;
        margin-right: 6px;
        font-size: 12px;
      }
      .bus-chip.passed {
        background: #e8f0fe;
        color: #1a54c4;
      }
      .stop-marker,
      .bus-icon {
        font-size: 20px;
        text-align: center;
        line-height: 22px;
        filter: drop-shadow(0 0 2px white);
        cursor: default;
      }
      .stop-marker.selectable {
        cursor: pointer;
      }
      .stop-marker.monitored {
        font-size: 22px;
      }
      .me-marker {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #1a73e8;
        border: 2px solid white;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
      }
      .bus-icon.stopped {
        filter: drop-shadow(0 0 3px #d32f2f) drop-shadow(0 0 3px #d32f2f);
      }
      .bus-icon.moving {
        filter: drop-shadow(0 0 3px #2e7d32) drop-shadow(0 0 3px #2e7d32);
      }
      .bus-icon.passed {
        filter: drop-shadow(0 0 3px #1a73e8) drop-shadow(0 0 3px #1a73e8);
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="instructionBar">
      <div id="instruction">Caricamento mappa...</div>
      <button id="stopMonitoringButton" type="button">Ferma monitoraggio</button>
    </div>
    <div id="lineFilterBar">
      <label id="lineFilterToggle"><input type="checkbox" id="lineFilterEnabled" disabled /> Filtra per linea</label>
      <div id="lineFilterList"></div>
    </div>
    <div id="map"></div>
    <div id="busStatusBar"></div>
    <script type="module" src="map.js"></script>
  </body>
</html>
